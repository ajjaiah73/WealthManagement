[project]
name = "superannuation-advisory-backend"
version = "0.1.0"
description = "Autonomous Multi-Agent Neuro-Symbolic Framework for Superannuation Advisory and Regulatory Compliance Verification."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "z3-solver>=4.13",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "python-multipart>=0.0.9",
    "anthropic>=1.8",
    "langgraph>=1.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "neo4j>=5.26",
    "networkx>=3.4",
    "psycopg[binary]>=3.2",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends(...) default-argument pattern is intentional
    "UP042", # str+Enum kept for stable JSON-string serialization; not enum.StrEnum
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

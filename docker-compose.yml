services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: advisor
      MYSQL_USER: advisor
      MYSQL_PASSWORD: advisorpass
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadvisor", "-padvisorpass"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/financialpass
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
